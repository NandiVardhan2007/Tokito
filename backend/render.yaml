# Render Blueprint for the Tokito backend. In Render: New > Blueprint, pick this repo and set the
# Blueprint file path to backend/render.yaml. Secrets (sync: false) are entered in the dashboard.
services:
  - type: web
    name: tokito-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: tokito
      - key: FIREBASE_PROJECT_ID
        value: tokito-919e7
      - key: MAX_BACKUP_BYTES
        value: "52428800"
